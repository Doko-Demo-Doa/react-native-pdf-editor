buildscript {
  ext.PdfEditor = [
    kotlinVersion: "2.0.21",
    // io.github.doko-demo-doa:podofo-android's own AndroidManifest declares
    // minSdk 26 — a consuming app's minSdk can't go lower than that (Gradle's
    // manifest merger rejects it), so this library documents/enforces the
    // same floor rather than letting a lower default here mask the real
    // requirement until someone hits the merger error downstream.
    minSdkVersion: 26,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return PdfEditor[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply from: '../nitrogen/generated/android/pdfeditor+autolinking.gradle'

apply plugin: "com.facebook.react"

react {
  // Without this, RNGP's default `jsRootDir` for a library resolves to the
  // monorepo root instead of this package's own directory, so codegen scans
  // the whole workspace and regenerates ViewManager specs for every other
  // autolinked package (e.g. react-native-gesture-handler's), duplicating
  // classes that package already compiles itself and breaking dexing in any
  // consuming app that also depends on them directly. See the upstream bug:
  // https://github.com/facebook/react-native/pull/35992
  jsRootDir = file("../")
}

android {
  namespace "com.margelo.nitro.pdfeditor"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packaging {
    resources {
      excludes += [
        "META-INF",
        "META-INF/**"
      ]
    }

    jniLibs {
      excludes += [
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libjsi.so",
        "**/libfolly_json.so",
        "**/libfolly_runtime.so",
        "**/libglog.so",
        "**/libhermes.so",
        "**/libhermes-executor-debug.so",
        "**/libhermes_executor.so",
        "**/libreactnative.so",
        "**/libreactnativejni.so",
        "**/libturbomodulejsijni.so",
        "**/libreact_nativemodule_core.so",
        "**/libjscexecutor.so"
      ]
    }
  }

  buildFeatures {
    prefab true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation project(":react-native-nitro-modules")
  implementation "io.github.doko-demo-doa:podofo-android:0.0.12"
}
