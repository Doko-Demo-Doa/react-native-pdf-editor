packages:
  - example

nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false

allowBuilds:
  lefthook: true
overrides:
  uuid@<11.1.1: ^11.1.1
  decode-uri-component@<0.5.0: ^0.5.0
minimumReleaseAgeExclude:
  - uuid@11.1.1
  - '@doko/react-native-yubikit'
patchedDependencies:
  '@expo/metro-config': patches/@expo__metro-config.patch
