packages:
  - example

nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false

allowBuilds:
  lefthook: true
overrides:
  uuid@<11.1.1: ^11.1.1
minimumReleaseAgeExclude:
  - uuid@11.1.1
  - '@doko/react-native-yubikit@0.0.5'
patchedDependencies:
  '@expo/metro-config': patches/@expo__metro-config.patch
